<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@600;700&family=Syne:wght@800&display=block" rel="stylesheet">
<style>
:root{--bg:oklch(0.975 0.012 85);--fg:oklch(0.2 0.02 270);--primary:oklch(0.66 0.2 35);--secondary:oklch(0.52 0.2 262);--accent:oklch(0.9 0.17 125);--muted:oklch(0.48 0.02 270)}
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:Manrope,sans-serif;position:relative}
.wrap{position:absolute;inset:64px 72px;display:flex;flex-direction:column}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700;letter-spacing:.04em}
.dot{width:14px;height:14px;border-radius:50%;background:var(--primary)}
h1{margin-top:34px;font-family:Syne;font-weight:800;font-size:86px;line-height:1.02;letter-spacing:-.02em}
h1 .c{color:var(--primary)}
.serif{font-family:'Instrument Serif';font-style:italic;font-weight:400;color:var(--secondary)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid color-mix(in oklch,var(--fg) 14%,transparent);padding-top:24px;font-size:22px;font-weight:600;color:var(--muted)}
.chips{display:flex;gap:10px}
.chip{border:2px solid var(--fg);border-radius:99px;padding:6px 16px;color:var(--fg);background:#fff8}
.chip.a{background:var(--accent)}
/* The card stack from the hero, simplified. */
.cards{position:absolute;right:72px;top:46px;width:300px;height:420px}
.card{position:absolute;width:240px;height:262px;border:3px solid var(--fg);border-radius:22px;box-shadow:8px 8px 0 var(--fg);padding:20px 22px;font-family:Syne;font-weight:800;font-size:34px}
.card small{display:block;font:600 15px Manrope;margin-top:6px;opacity:.75}
</style></head><body>
<div class="cards">
  <div class="card" style="left:0;top:0;transform:rotate(-5deg);background:var(--accent)">Books<small>pages that changed me</small></div>
  <div class="card" style="left:22px;top:62px;transform:rotate(-1deg);background:oklch(0.82 0.1 350)">Music<small>yun hi, on repeat</small></div>
  <div class="card" style="left:44px;top:124px;transform:rotate(4deg);background:var(--primary);color:#fff">Chess<small style="color:#fff">mate in one?</small><div style="font-size:104px;line-height:1;margin-top:8px;font-family:serif;font-weight:400">♞</div></div>
</div>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>FRONTEND DEVELOPER @ PINNTAG</div>
  <h1>Shreyansh<span class="c">.</span><br><span class="serif">Code meets</span><br>curiosity.</h1>
  <div class="foot">
    <div class="chips"><span class="chip a">React</span><span class="chip">Node.js</span><span class="chip">AI &amp; RAG</span></div>
    <span>shreyanshsachan-portfolio.vercel.app</span>
  </div>
</div>
</body></html>
